#
# Strings for the UX fork (com.cburch.logisim.fork). English only; other locales fall back to this file.
#
# ==> Preferences tab
forkUxTitle = Fork UX
forkUxHelp = Turn individual features of the UX fork on or off.
forkUxIntro = Each feature of the UX fork can be switched off here. Changes apply immediately.
forkCategoryNavigation = Canvas navigation
# ==> Feature flags
forkFlagSpacePan = Space + drag pans the canvas
forkFlagSpacePanDesc = Hold Space and drag to pan. Also works while drawing a wire.
forkFlagMiddlePan = Middle-button drag pans the canvas
forkFlagMiddlePanDesc = Middle-drag pans with any tool; a middle click still pokes. On macOS, Cmd + click acts as the middle button.
forkFlagZoomToCursor = Zoom towards the cursor with Mod + scroll and Mod + plus/minus
forkFlagZoomToCursorDesc = Mod is Cmd on macOS and Ctrl elsewhere. The point under the cursor stays put.
forkFlagPinchZoom = Trackpad pinch zooms (macOS)
forkFlagPinchZoomDesc = Pinch on a trackpad to zoom towards the fingers.
forkFlagFitKeys = F fits the circuit, Shift + F fits the selection
forkFlagFitKeysDesc = Zooms and scrolls so everything (or the selection) is visible.
forkFlagResetZoom = Mod + 0 resets zoom to 100%
forkFlagResetZoomDesc = Keeps the toolbar zoom control in sync.
forkFlagCircuitSwitcher = Ctrl + Tab switches between recently used circuits
forkFlagCircuitSwitcherDesc = Hold Ctrl and press Tab (or Shift + Tab) to pick a circuit, release Ctrl to open it.
forkFlagBackToParent = Alt + Up returns to the parent circuit
forkFlagBackToParentDesc = Goes up after viewing a subcircuit, or back to the previously viewed circuit. Only when nothing is selected.
# ==> Circuit switcher
forkSwitcherTitle = Recent circuits
forkCategoryPalette = Command palette
forkCategoryKeyboard = Keyboard shortcuts
forkCategorySelection = Selection editing
forkCategoryWiring = Wiring
forkCategoryFeedback = Feedback
forkFlagPalette = Command palette extensions (Mod + Shift + P)
forkFlagPaletteDesc = Find Action also lists circuits and fork commands; ">" = actions only, "@" = circuits only, "and 3" = 3-input AND.
forkFlagSingleKeyTools = Single-key tools (W wire, A/O/N/X gates, I/P pins, T text, Esc)
forkFlagSingleKeyToolsDesc = Only while the canvas has focus and nothing is being typed. Gate size and auto-label keys move to Alt + letter.
forkFlagRotateKeys = R / Shift + R rotate
forkFlagRotateKeysDesc = Rotates the selection, or the component being placed, by 90 degrees.
forkFlagCheatSheet = ? shows the shortcut cheat sheet
forkFlagCheatSheetDesc = Lists every fork shortcut, including changes from keymap.json.
forkFlagNudge = Arrow keys nudge the selection
forkFlagNudgeDesc = 1 grid step, or 5 with Shift. Change facing with R / Shift + R instead.
forkFlagDuplicateOffset = Duplicate (Mod + D) places the copy one grid step down-right
forkFlagDuplicateOffsetDesc = Instead of under the mouse pointer. The copy is selected.
forkFlagAlign = Align and distribute commands
forkFlagAlignDesc = Mod + Alt + arrows align the selection; more in the command palette.
forkFlagSnapGuides = Alignment guides while dragging
forkFlagSnapGuidesDesc = Shows a line when a moving pin lines up with a pin nearby. Drawing only.
forkFlagSelectConnected = Double-click a wire to select its net
forkFlagSelectConnectedDesc = Shift + double-click a component selects it and everything wired to it.
forkFlagNetHighlight = Highlight the net under the pointer
forkFlagNetHighlightDesc = Hovering a wire highlights every segment connected to it. Drawing only.
forkFlagShowUnconnected = Mark unconnected pins and dangling wire ends
forkFlagShowUnconnectedDesc = Draws a small red marker where nothing is attached. Drawing only.
forkFlagPinWiring = Easier wiring from pins
forkFlagPinWiringDesc = A larger hit area around pins and wire ends, and a crosshair cursor over them.
forkFlagClickRoute = Click-to-route wires
forkFlagClickRouteDesc = Click a pin, click to add bends, click a pin or wire to finish. Space flips, Esc cancels.
forkFlagWireCleanup = "Clean up wires" command
forkFlagWireCleanupDesc = Removes dangling wire stubs, only when you run it. Connections never change.
forkFlagSegmentDelete = Alt + click deletes one wire segment
forkFlagSegmentDeleteDesc = Removes the wire between the nearest junctions.
forkFlagDeleteDangling = Deleting components also deletes wires left dangling
forkFlagDeleteDanglingDesc = Wires that only led to the deleted components are removed in the same undo step.
forkFlagStatusHints = Status hints for modal actions
forkFlagStatusHintsDesc = Shows what keys do while routing a wire and similar modes.
