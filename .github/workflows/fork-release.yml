#
# UX fork: build installers for Windows, macOS and Linux.
#
# Runs when started by hand (Actions tab > "Fork installers" > Run workflow) or when a tag named
# fork-v* is pushed (for example fork-v1.0). Every run uploads the installers as workflow
# artifacts. A tag run also creates a draft GitHub Release with the installers attached; publish
# it from the Releases page once you have checked it.
#
# Installers use the "forkInstaller" id from gradle.properties, so they install alongside the
# stock Logisim-evolution instead of replacing it. They are not code-signed: macOS asks you to
# confirm the first launch (right-click > Open) and Windows SmartScreen may warn once.
#

name: "Fork installers"

on:
  workflow_dispatch:
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: write

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'

jobs:
  # ###############################################################################################
  # Tests on all three platforms, and the stock-vs-fork regression check on Linux.

  test:
    name: "Tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}
          cache: gradle
      - name: "Unit tests"
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test
      - name: "Regression check against the stock release"
        if: runner.os == 'Linux'
        run: scripts/regression.sh
      - name: "Upload test reports on failure"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/regression/

  # ###############################################################################################
  # A draft release to attach installers to (tag runs only).

  draft_release:
    name: "Create draft release"
    if: startsWith(github.ref, 'refs/tags/fork-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Create draft release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --draft --prerelease \
            --title "Logisim-evolution UX fork ${GITHUB_REF_NAME#fork-v}" \
            --notes "Installers for the UX fork. They install alongside the stock Logisim-evolution. Not code-signed: on macOS right-click the app and choose Open the first time; on Windows choose More info > Run anyway if SmartScreen warns."

  # ###############################################################################################
  # Installers. Each job uploads workflow artifacts, and on tag runs adds them to the draft release.

  linux:
    name: "Linux installers (${{ matrix.arch }})"
    needs: [ test, draft_release ]
    # Run after tests on manual runs too, where draft_release is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}
          cache: gradle
      - name: "Build DEB and RPM"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew shadowJar createDeb createRpm -x checkstyleMain -x checkstyleTest
          ls -l build/dist build/libs
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/dist/*.deb
            build/dist/*.rpm
            build/libs/*-all.jar
      - name: "Attach to release"
        if: startsWith(github.ref, 'refs/tags/fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" build/dist/*.deb build/dist/*.rpm --clobber
          # The platform-independent jar once is enough.
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            gh release upload "${GITHUB_REF_NAME}" build/libs/*-all.jar --clobber
          fi

  macos:
    name: "macOS installers"
    needs: [ test, draft_release ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Set up Apple Silicon JDK"
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}
          cache: gradle
      - name: "Build Apple Silicon DMG"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createDmg -x checkstyleMain -x checkstyleTest
      - name: "Set up Intel JDK"
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}
          architecture: "x64"
      - name: "Build Intel DMG"
        run: |
          set -euo pipefail
          ./gradlew --stop
          ./gradlew createDmg -x checkstyleMain -x checkstyleTest
          ls -l build/dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: build/dist/*.dmg
      - name: "Attach to release"
        if: startsWith(github.ref, 'refs/tags/fork-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/dist/*.dmg --clobber

  windows:
    name: "Windows installers"
    needs: [ test, draft_release ]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}
          cache: gradle
      - name: "Build MSI and portable ZIP"
        run: |
          .\gradlew.bat createMsi createWindowsPortableZip -x checkstyleMain -x checkstyleTest
          Get-ChildItem build\dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            build/dist/*.msi
            build/dist/*.zip
      - name: "Attach to release"
        if: startsWith(github.ref, 'refs/tags/fork-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/dist/*.msi build/dist/*.zip --clobber
